<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<canvas id="eyes"></canvas>
<div id="status"></div>

<footer id="bar">
  <button id="b-mode" title="Plan / Build"><i></i><span>plan</span></button>
  <span id="b-mid"></span>
  <button id="b-mic" title="Voice"><b></b></button>
  <button id="b-chat" title="Talk · Tab">Talk</button>
  <a href="/settings" title="Settings">Settings</a>
</footer>

<section id="sheet" class="closed">
  <nav>
    <button data-tab="chat" class="on">Chat</button><button data-tab="plan">Plan</button><button data-tab="design">Design</button><button data-tab="built">Built</button><button data-tab="anims">Anims</button>
    <span class="grow"></span><span id="pct"></span><button id="close">Close</button>
  </nav>
  <div id="t-chat" class="tab on">
    <div id="log"></div>
    <div id="consent" class="hidden"><span>Nex wants to run a playtest.</span><button id="c-yes">Allow once</button><button id="c-no">No</button></div>
    <form id="row"><input id="input" autocomplete="off" placeholder="Message Nex"><button type="submit">Send</button></form>
  </div>
  <div id="t-plan" class="tab"><div class="ctl"><button data-p="resume">Go / continue</button><button data-p="pause">Pause</button><button data-p="stop">Stop</button></div><div id="plan"></div></div>
  <div id="t-design" class="tab"><div id="gdd"></div></div>
  <div id="t-built" class="tab"><ul id="ledger"></ul></div>
  <div id="t-anims" class="tab"><div id="anims"></div></div>
</section>

<script src="/static/anims.js"></script>
<script src="/static/eyes.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
