<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nex</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<canvas id="eyes"></canvas>

<!-- the only thing under the eyes: a quiet status line -->
<div id="status"><span id="status-text"></span></div>
<div id="thought"></div>

<!-- thin bottom bar -->
<footer id="bar">
  <button id="bar-mode" title="Plan / Build"><i></i><span>plan</span></button>
  <span id="bar-mid"></span>
  <button id="bar-mic" title="Voice"><b></b></button>
  <button id="bar-chat" title="Talk (Tab)">···</button>
  <a href="/settings" id="bar-settings" title="Settings">⚙</a>
</footer>

<!-- slide-up sheet: chat + plan. hidden unless opened -->
<section id="sheet" class="closed">
  <nav class="sheet-tabs"><button data-tab="chat" class="on">Chat</button><button data-tab="plan">Plan</button><button data-tab="design">Design</button><button data-tab="built">Built</button><button data-tab="anims">Anims</button><span class="flex"></span><span id="plan-pct"></span><button id="sheet-close">✕</button></nav>
  <div class="sheet-body">
    <div id="tab-chat" class="tab on">
      <div id="log"></div>
      <div id="consent" class="hidden"><span>Nex wants to run a playtest.</span><button id="consent-yes">Allow once</button><button id="consent-no">No</button></div>
      <form id="input-row"><input id="input" autocomplete="off" placeholder="Message Nex"><button type="submit">↵</button></form>
    </div>
    <div id="tab-plan" class="tab"><div class="plan-ctl"><button data-p="resume">▶ go / continue</button><button data-p="pause">⏸ pause</button><button data-p="stop">⏹ stop</button></div><div id="plan-body"></div></div>
    <div id="tab-design" class="tab"><div id="gdd-body"></div></div>
    <div id="tab-built" class="tab"><ul id="ledger" class="ledger"></ul></div>
    <div id="tab-anims" class="tab"><div id="anim-picker"></div></div>
  </div>
</section>

<script src="/static/animations.js"></script>
<script src="/static/eyes.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
